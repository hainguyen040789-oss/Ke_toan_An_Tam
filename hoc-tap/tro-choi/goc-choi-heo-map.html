<title>Góc chơi Heo Mập</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: một cột như trang vở ô li; mỗi màn một việc, nút to cho ngón tay bé */
:root{
  --paper:#fbfcff; --grid:#dfe7f6; --ink:#4b2a8c; --ink-soft:#6f5a9c;
  --red:#d6363b; --star:#f4b400; --ok:#1f8a4c; --card:#ffffff; --line:#c9d3ea;
  --key:#efeaf9; --key-press:#ddd2f3; --mark:#fff0b3;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1c2420; --grid:#26302b; --ink:#f1ecdf; --ink-soft:#b9b3a3;
  --red:#ff7a6e; --star:#ffd24a; --ok:#6fd49a; --card:#232d28; --line:#3a4640;
  --key:#2c3832; --key-press:#3a4a42; --mark:#5a4a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c2420; --grid:#26302b; --ink:#f1ecdf; --ink-soft:#b9b3a3;
  --red:#ff7a6e; --star:#ffd24a; --ok:#6fd49a; --card:#232d28; --line:#3a4640;
  --key:#2c3832; --key-press:#3a4a42; --mark:#5a4a12; color-scheme:dark}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 28px;
}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--ink-soft);margin:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;font-weight:800}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-weight:800;font-size:.95rem}
.steps span{padding:4px 10px;border-radius:8px;color:var(--ink-soft);border:2px dashed var(--line)}
.steps span.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.story{font-size:1.25rem;line-height:1.6;margin:0;font-weight:700}
.story mark{background:var(--mark);color:var(--ink);border-radius:4px;padding:0 3px}
.prob{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,10vw,3.2rem);text-align:center;line-height:1.15;font-variant-numeric:tabular-nums}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.8rem);text-align:center;line-height:1.2}
.box{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--ink)}
.box.empty{color:var(--line)}
.hint{text-align:center;color:var(--ink-soft);margin:0;font-weight:700}
.msg{text-align:center;font-weight:800;font-size:1.1rem;margin:0;min-height:1.4em}
.msg.bad{color:var(--red)} .msg.good{color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{font-family:var(--f-display);font-weight:800;cursor:pointer;border:none;color:var(--ink)}
button:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.pad button{background:var(--key);font-size:1.9rem;padding:10px 0;border-radius:14px}
.pad button:active,.opt:active{background:var(--key-press)}
.pad .del{font-size:1.2rem}
.pad .go{background:var(--ink);color:var(--paper);font-size:1.3rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--key);font-size:1.8rem;padding:14px 8px;border-radius:14px;font-variant-numeric:tabular-nums}
.big{background:var(--ink);color:var(--paper);font-size:1.3rem;padding:14px 18px;border-radius:14px;width:100%}
.ghost{background:var(--key);font-size:1.15rem;padding:12px 16px;border-radius:14px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{display:grid;gap:12px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode b{font-size:1.4rem}
.mode small{font-family:var(--f-body);font-weight:700;color:var(--ink-soft);font-size:.95rem}
.dapso{font-size:1.2rem;font-weight:800;text-align:center;margin:0}
.stars{font-size:2rem;text-align:center;letter-spacing:4px;word-break:break-all}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.note{font-size:.95rem;color:var(--ink-soft);margin:0}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.9)}70%{transform:scale(1.04)}100%{transform:scale(1)}}}
</style>

<main id="app"></main>

<script>
const N_LOIVAN = 6, N_CHINHTA = 10;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};

// ---------- Toán có lời văn ----------
// Từ khóa được tô vàng sau khi bé chọn phép tính, để bé thấy "chữ nào cho biết cộng hay trừ"
const TPL_CONG=[
  (a,b)=>({t:`Heo Mập có ${a} viên kẹo. Mẹ <mark>cho thêm</mark> ${b} viên kẹo. Hỏi Heo Mập có <mark>tất cả</mark> bao nhiêu viên kẹo?`, dv:'viên kẹo', loi:'Heo Mập có tất cả số viên kẹo là'}),
  (a,b)=>({t:`Lớp em có ${a} bạn trai và ${b} bạn gái. Hỏi lớp em có <mark>tất cả</mark> bao nhiêu bạn?`, dv:'bạn', loi:'Lớp em có tất cả số bạn là'}),
  (a,b)=>({t:`Trong vườn có ${a} cây cam. Bố <mark>trồng thêm</mark> ${b} cây cam. Hỏi trong vườn có <mark>tất cả</mark> bao nhiêu cây cam?`, dv:'cây cam', loi:'Trong vườn có tất cả số cây cam là'}),
  (a,b)=>({t:`Ao có ${a} con vịt. ${b} con vịt nữa <mark>bơi đến</mark>. Hỏi ao có <mark>tất cả</mark> bao nhiêu con vịt?`, dv:'con vịt', loi:'Ao có tất cả số con vịt là'}),
];
const TPL_TRU=[
  (a,b)=>({t:`Trên cây có ${a} quả táo. Bố <mark>hái xuống</mark> ${b} quả. Hỏi trên cây <mark>còn lại</mark> bao nhiêu quả táo?`, dv:'quả táo', loi:'Trên cây còn lại số quả táo là'}),
  (a,b)=>({t:`Cành cây có ${a} con chim. ${b} con <mark>bay đi</mark>. Hỏi trên cành <mark>còn lại</mark> bao nhiêu con chim?`, dv:'con chim', loi:'Trên cành còn lại số con chim là'}),
  (a,b)=>({t:`Heo Mập có ${a} cái bút chì. Bé <mark>cho bạn</mark> ${b} cái. Hỏi Heo Mập <mark>còn lại</mark> bao nhiêu cái bút chì?`, dv:'cái bút chì', loi:'Heo Mập còn lại số bút chì là'}),
  (a,b)=>({t:`Cửa hàng có ${a} cái bánh. Đã <mark>bán</mark> ${b} cái. Hỏi cửa hàng <mark>còn lại</mark> bao nhiêu cái bánh?`, dv:'cái bánh', loi:'Cửa hàng còn lại số cái bánh là'}),
];
function makeLoiVan(){
  let x,y; do{x=rnd(3,9);y=rnd(3,9);}while(x+y<=10);   // qua 10, tổng 11–18
  if(Math.random()<0.5){ const s=pick(TPL_CONG)(x,y); return {...s,op:'+',a:x,b:y,ans:x+y}; }
  const s=pick(TPL_TRU)(x+y,y); return {...s,op:'−',a:x+y,b:y,ans:x};
}

// ---------- Chính tả ----------
// ctx: chỗ "…" là nơi điền; opts[0] là chữ đúng
const CT=[
  {ctx:'con …', opts:['cá','ká'], rule:'k chỉ đi với e, ê, i. Còn lại dùng c.'},
  {ctx:'… chuyện', opts:['kể','cể'], rule:'Trước ê dùng k.'},
  {ctx:'thước …', opts:['kẻ','cẻ'], rule:'Trước e dùng k.'},
  {ctx:'cây …', opts:['kim','cim'], rule:'Trước i dùng k.'},
  {ctx:'con …', opts:['cua','kua'], rule:'Trước u dùng c.'},
  {ctx:'con …', opts:['gà','ghà'], rule:'gh chỉ đi với e, ê, i. Còn lại dùng g.'},
  {ctx:'cái …', opts:['ghế','gế'], rule:'Trước ê dùng gh.'},
  {ctx:'… nhớ', opts:['ghi','gi'], rule:'Trước i dùng gh.'},
  {ctx:'cái …', opts:['gương','ghương'], rule:'Trước ư dùng g.'},
  {ctx:'bàn …', opts:['gỗ','ghỗ'], rule:'Trước ô dùng g.'},
  {ctx:'lắng …', opts:['nghe','nge'], rule:'ngh chỉ đi với e, ê, i. Còn lại dùng ng.'},
  {ctx:'… ngơi', opts:['nghỉ','ngỉ'], rule:'Trước i dùng ngh.'},
  {ctx:'bé …', opts:['ngoan','nghoan'], rule:'Trước o dùng ng.'},
  {ctx:'con …', opts:['ngựa','nghựa'], rule:'Trước ư dùng ng.'},
  {ctx:'… tranh', opts:['vẽ','vẻ'], rule:'Nhớ: vẽ tranh (dấu ngã).'},
  {ctx:'… dây', opts:['nhảy','nhãy'], rule:'Nhớ: nhảy dây (dấu hỏi).'},
  {ctx:'sạch …', opts:['sẽ','sẻ'], rule:'Nhớ: sạch sẽ (dấu ngã).'},
  {ctx:'uống …', opts:['sữa','sửa'], rule:'Uống sữa (ngã). Còn "sửa" là sửa chữa (hỏi).'},
  {ctx:'cái …', opts:['mũ','mủ'], rule:'Nhớ: cái mũ (dấu ngã).'},
  {ctx:'bãi …', opts:['cỏ','cõ'], rule:'Nhớ: bãi cỏ (dấu hỏi).'},
  {ctx:'… cửa', opts:['mở','mỡ'], rule:'Mở cửa (hỏi). Còn "mỡ" là mỡ heo (ngã).'},
  {ctx:'… sớm', opts:['dậy','dạy'], rule:'Dậy sớm là thức dậy. Còn "dạy" là cô dạy học.'},
];
function makeChinhTa(){ return shuffle(CT).slice(0,N_CHINHTA).map(c=>({...c,shown:shuffle(c.opts)})); }

// ---------- Trạng thái ----------
let S;
const fresh=()=>({screen:'menu',mode:null,list:[],i:0,step:'',input:'',msg:'',msgCls:'',stars:0,tuSua:0,loiAu:0,tries:0,fixed:false,log:[]});
function start(d){ S=(d&&d.S)||fresh(); render(); }
window.claude?.hot?.snapshot?.(()=>({S}));
const cur=()=>S.list[S.i];

function beginMode(m){
  S=fresh(); S.mode=m; S.screen='play';
  S.list = m==='loivan' ? Array.from({length:N_LOIVAN},makeLoiVan) : makeChinhTa();
  S.step = m==='loivan' ? 'chon' : 'dien';
  render();
}
function say(t,c){ S.msg=t; S.msgCls=c||''; }

// Lời văn: bước 1 chọn phép tính
function chooseOp(op){
  const q=cur();
  if(op===q.op){ S.step='tinh'; S.input=''; say('Đúng rồi! Chữ tô vàng cho con biết làm phép '+(op==='+'?'cộng':'trừ')+'.','good'); }
  else { S.tries++; say(q.op==='+'?'Chưa đúng. Đọc lại đề: "thêm", "tất cả" là phép cộng nhé.':'Chưa đúng. Đọc lại đề: "bớt đi", "còn lại" là phép trừ nhé.','bad'); S.showMarks=true; }
  render();
}
function press(k){
  if(k==='del') S.input=S.input.slice(0,-1);
  else if(k==='ok') return submitNum();
  else if(S.input.length<2) S.input+=k;
  say(''); render();
}
function submitNum(){
  if(S.input===''){ say('Con điền số vào ô trống đã nhé!','bad'); return render(); }
  const v=+S.input, q=cur();
  if(S.step==='tinh'){ S.myAns=v; S.input=''; S.step='kiemtra'; say(''); return render(); }
  const target = q.op==='+' ? S.myAns : q.a;
  if(v!==target){
    S.fixed=true; S.step='tinh'; S.input=String(S.myAns);
    say(q.op==='+' ? `Ơ! ${q.b} + ${q.a} ra ${v}, chưa khớp với ${S.myAns}. Con tính lại nhé 🔍` : `Ơ! Thử lại ra ${v}, chưa bằng ${q.a}. Con tính lại nhé 🔍`,'bad');
    return render();
  }
  finish(S.myAns===q.ans && S.tries===0, S.myAns===q.ans, `${q.a} ${q.op} ${q.b} = ${q.ans} (${q.dv})`);
}
// Chính tả
function chooseWord(w){
  const q=cur();
  if(w===q.opts[0]){ finish(S.tries===0,true,`${q.ctx.replace('…',q.opts[0])}`); }
  else if(S.tries===0){ S.tries++; S.fixed=true; say('Chưa đúng. '+q.rule+' Con chọn lại nhé 🔍','bad'); render(); }
  else finish(false,false,`${q.ctx.replace('…',q.opts[0])}`);
}

function finish(clean,ok,label){
  let kq;
  if(ok && clean && !S.fixed){ S.stars++; kq='⭐'; say('Đúng rồi! Con được 1 ⭐','good'); }
  else if(ok){ S.tuSua++; kq='🔍'; say('Giỏi! Con xem lại và sửa được rồi. Thám tử 🔍!','good'); }
  else { S.loiAu++; kq='✗'; say('Chưa đúng. Đáp án đúng ở trên nhé. Lần sau mình chậm lại.','bad'); }
  S.log.push({p:label,kq}); S.step='xong'; render();
}
function next(){
  S.i++; S.input=''; S.tries=0; S.fixed=false; S.showMarks=false; say('');
  if(S.i>=S.list.length){ S.screen='end'; return render(); }
  S.step = S.mode==='loivan'?'chon':'dien'; render();
}

// ---------- Vẽ màn hình ----------
function keypad(){
  const ks=['1','2','3','4','5','6','7','8','9','del','0','ok'];
  return `<div class="pad">${ks.map(k=>`<button data-k="${k}" class="${k==='del'?'del':k==='ok'?'go':''}" aria-label="${k==='del'?'Xoá':k==='ok'?'Xong':k}">${k==='del'?'⌫ Xoá':k==='ok'?'Xong':k}</button>`).join('')}</div>`;
}
const boxv=()=>`<span class="box ${S.input===''?'empty':''}">${S.input===''?'?':S.input}</span>`;
function header(){
  const n=S.list.length;
  return `<div class="bar"><span class="chip">Câu ${Math.min(S.i+1,n)}/${n}</span><span class="chip">⭐ ${S.stars}</span><span class="chip">🔍 ${S.tuSua}</span><span class="chip">Sai ${S.loiAu}</span></div>`;
}
const nextBtn=()=>`<button class="big" data-act="next">${S.i+1<S.list.length?'Câu tiếp theo →':'Xem kết quả'}</button>`;

function render(){
  const app=document.getElementById('app'); let h='';
  if(S.screen==='menu'){
    h=`<h1>Góc chơi Heo Mập</h1>
    <p class="sub">Nhớ 3 bước: <b>Đọc đề → Làm → Kiểm tra lại</b>. Làm chậm mà chắc mới được ⭐.</p>
    <div class="menu">
      <button class="mode" data-mode="loivan"><b>🍎 Toán có lời văn</b><small>${N_LOIVAN} bài. Đọc đề, chọn phép cộng hay trừ, tính, rồi thử lại.</small></button>
      <button class="mode" data-mode="chinhta"><b>✏️ Chọn chữ viết đúng</b><small>${N_CHINHTA} câu. c hay k, g hay gh, ng hay ngh, dấu hỏi hay dấu ngã.</small></button>
    </div>
    <p class="note">Phụ huynh: ⭐ = đúng ngay; 🔍 = sai nhưng bé tự sửa được; Sai = vẫn chưa đúng sau khi sửa. Cuối lượt có bảng ghi từng câu. Các bài đổi ngẫu nhiên mỗi lần chơi.</p>`;
  } else if(S.screen==='play'){
    const q=cur();
    if(S.mode==='loivan'){
      const st=S.step;
      const steps=`<div class="steps"><span class="${st==='chon'?'on':''}">① Đọc đề, chọn phép tính</span><span class="${st==='tinh'?'on':''}">② Làm</span><span class="${st==='kiemtra'?'on':''}">③ Kiểm tra lại</span></div>`;
      const story=`<p class="story">${(st==='chon'&&!S.showMarks)?q.t.replace(/<\/?mark>/g,''):q.t}</p>`;
      let body;
      if(st==='chon'){
        // Hai lựa chọn dùng đúng hai số trong đề; thứ tự nút đổi theo từng bài
        const plusT = `${q.a} + ${q.b}`;
        const minusT = q.op==='−'?`${q.a} − ${q.b}`:`${Math.max(q.a,q.b)} − ${Math.min(q.a,q.b)}`;
        const list = (q.a+q.b)%2 ? [['+',plusT],['−',minusT]] : [['−',minusT],['+',plusT]];
        body=`${story}<p class="hint">Bài này làm phép tính nào?</p><div class="opts">${list.map(([o,t])=>`<button class="opt" data-op="${o}">${t}</button>`).join('')}</div>`;
      } else if(st==='tinh'){
        body=`${story}<div class="prob pop">${q.a} ${q.op} ${q.b} = ${boxv()}</div>${keypad()}`;
      } else if(st==='kiemtra'){
        body=`<p class="hint">Con vừa làm: ${q.a} ${q.op} ${q.b} = ${S.myAns}</p><p class="hint">${q.op==='+'?'Đổi chỗ hai số, kết quả phải giống nhau:':'Thử lại bằng phép cộng, phải ra '+q.a+':'}</p><div class="prob pop">${q.op==='+'?`${q.b} + ${q.a}`:`${S.myAns} + ${q.b}`} = ${boxv()}</div>${keypad()}`;
      } else {
        body=`${story}<div class="card" style="gap:6px"><p class="dapso">Bài giải</p><p class="hint" style="text-align:left">${q.loi}:</p><p class="dapso">${q.a} ${q.op} ${q.b} = ${q.ans} (${q.dv})</p><p class="dapso">Đáp số: ${q.ans} ${q.dv}</p></div>${nextBtn()}`;
      }
      h=`${header()}${steps}<div class="card">${body}<p class="msg ${S.msgCls}">${S.msg}</p></div>`;
    } else {
      let body;
      if(S.step==='dien'){
        body=`<p class="hint">Chữ nào viết đúng?</p><div class="word pop">${q.ctx.replace('…','<span class="box empty">?</span>')}</div><div class="opts">${q.shown.map(w=>`<button class="opt" data-w="${w}">${w}</button>`).join('')}</div>`;
      } else {
        body=`<div class="word">${q.ctx.replace('…','<span class="box">'+q.opts[0]+'</span>')}</div><p class="hint">${q.rule}</p>${nextBtn()}`;
      }
      h=`${header()}<div class="card">${body}<p class="msg ${S.msgCls}">${S.msg}</p></div>`;
    }
    h+=`<button class="ghost" data-act="menu">← Về trang đầu</button>`;
  } else {
    const n=S.list.length, perfect=S.loiAu===0;
    h=`<h1>${perfect?'Tuyệt vời! 🎉':'Xong rồi!'}</h1>
    <div class="card"><div class="stars">${'⭐'.repeat(S.stars)||'—'}</div>
    <p class="msg ${perfect?'good':''}">${S.stars}/${n} câu đúng ngay · ${S.tuSua} câu tự sửa · ${S.loiAu} câu sai</p>
    <p class="hint">${perfect?'Không sai câu nào. Con đọc đề và kiểm tra rất cẩn thận!':'Lần sau mình đọc chậm hơn và kiểm tra lại kỹ hơn nhé.'}</p></div>
    <div class="card"><b>Bảng ghi cho phụ huynh</b><table>${S.log.map(r=>`<tr><td>${r.p}</td><td>${r.kq}</td></tr>`).join('')}</table></div>
    <div class="two"><button class="big" data-mode="${S.mode}">Chơi lại</button><button class="ghost" data-act="menu">Trang đầu</button></div>`;
  }
  app.innerHTML=h;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.mode) beginMode(b.dataset.mode);
  else if(b.dataset.k) press(b.dataset.k);
  else if(b.dataset.op) chooseOp(b.dataset.op);
  else if(b.dataset.w) chooseWord(b.dataset.w);
  else if(b.dataset.act==='next') next();
  else if(b.dataset.act==='menu'){ S=fresh(); render(); }
});
document.addEventListener('keydown',e=>{
  if(!S||S.screen!=='play'||!['tinh','kiemtra'].includes(S.step)) return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('del');
  else if(e.key==='Enter'){ e.preventDefault(); press('ok'); }
});

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
